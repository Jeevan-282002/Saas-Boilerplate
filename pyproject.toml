[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "django-boilerplate"
version = "0.1.0"
description = "A production-minded Django REST API starter"
requires-python = ">=3.13"
dependencies = [
    "celery[redis]>=5.4,<6",
    "dj-database-url>=2.3,<3",
    "Django>=5.2,<5.3",
    "django-filter>=24.3,<26",
    "python-dotenv>=1.0,<2",
    "djangorestframework>=3.15,<4",
    "djangorestframework-simplejwt>=5.3,<6",
    "drf-spectacular>=0.28,<1",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "whitenoise>=6.8,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-django>=4.9,<5",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["config*", "apps*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_tests.py", "tests.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
